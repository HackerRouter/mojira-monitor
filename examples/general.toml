# Standalone configuration for Java world and chunk issues, without requiring a crash.
# Paths are relative to this file in examples/, so use ../data/.
monitor_id = "world-data"
name = "World and chunk data issues"
database = "../data/world-data.sqlite3"
projects = ["MC"]
source = "official"
tags = ["world", "data-integrity"]

[classification]
mode = "keywords"
category = "world_data"
keywords_any = ["corrupt", "missing chunks", "world corruption", "chunk loss"]
# keywords_any and patterns_any form one group; at least one expression must match.
patterns_any = ['\bworld\s+(?:data\s+)?loss\b']
keywords_all = [] # Also require every keyword in this list when it is nonempty.
exclude_keywords = []
exclude_patterns = []
fields = ["summary", "description"]
case_sensitive = false

[filters]
labels_any = []
labels_all = []
exclude_labels = []

[polling]
collect_minutes = 30
recheck_hours = 24

[ai]
mode = "off"
# Optional relevance criteria used when AI classification is enabled.
criteria = "Only track world or chunk data loss and corruption caused by the game itself."
