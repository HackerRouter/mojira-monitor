# Paths are relative to this configuration file.
database = "data/mojira.sqlite3"
projects = ["MC", "MCPE", "BDS"]
source = "official" # official or mirror; mirror access may require a Cloudflare challenge.
official_url = "https://bugs.mojang.com/api/jql-search-post"
mirror_url = "https://mojira.dev/api/v1"

[polling]
collect_minutes = 20
recheck_hours = 12
duplicate_recheck_hours = 168 # Recheck inactive duplicates periodically so reopened reports can recover.
recheck_batch = 100
page_size = 50
bootstrap_pages = 2 # Limit initial collection to a recent subset (up to 100 reports per project).
initial_hours = 24
overlap_hours = 6
max_pages = 30 # Hitting this limit does not advance the checkpoint; increase it to clear a backlog.
backfill_hours = 168 # Rescan the last seven days to recover delayed or displaced reports.
backfill_interval_hours = 24

[http]
timeout_seconds = 30
min_interval_seconds = 1
retries = 3

[classification]
mode = "crash" # crash (built-in crash classification), keywords (general matching), or all.
fields = ["summary", "description", "environment"]
include_hangs = false
# Additional regular expressions for suspected crashes; case-insensitive by default.
extra_patterns = []

[ai]
mode = "off" # off, candidates (rule matches), or all (every new or changed eligible report).
# Optional Chat Completions-compatible service. Read the API key from the named environment variable.
base_url = ""
model = ""
api_key_env = "MOJIRA_AI_API_KEY"
min_confidence = 0.75
max_chars = 16000

# Each monitor inherits the defaults above and can override projects, source, or configuration sections.
# Each monitor uses a separate database and checkpoints to keep its state independent.
[[monitors]]
id = "crashes"
name = "Minecraft crash reports"
enabled = true
database = "data/mojira.sqlite3" # Reuse the database from the original single-monitor configuration.
tags = ["stability", "crash"]

[[monitors]]
id = "bedrock-performance"
name = "Bedrock performance issues"
enabled = false # Set true to run by default, or select explicitly with --monitor bedrock-performance.
projects = ["MCPE", "BDS"]
tags = ["performance", "bedrock"]
# Omitting database generates data/mojira.bedrock-performance.sqlite3 automatically.

[monitors.classification]
mode = "keywords"
category = "performance"
keywords_any = ["fps", "stutter", "frame rate"]
keywords_all = []
exclude_keywords = ["feature request"]
patterns_any = ['\blag(?:gy|ging)?\b'] # Word boundaries prevent matching lag inside villager.
exclude_patterns = []
case_sensitive = false

[monitors.polling]
collect_minutes = 30

[[monitors]]
id = "java-redstone"
name = "Java redstone issues"
enabled = false
projects = ["MC"]
tags = ["redstone"]

[monitors.classification]
mode = "keywords"
category = "redstone"
keywords_any = ["redstone", "piston"]
fields = ["summary", "description"]

[monitors.filters]
# These filters match issue labels exactly and case-sensitively. Put MC or MCPE in projects instead.
labels_any = [] # Match at least one label; use actual label names from the source.
labels_all = [] # Require every listed label.
exclude_labels = [] # Exclude reports containing any listed label.
