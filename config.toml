# 路径相对于此配置文件。Python 3.11+
database = "data/mojira.sqlite3"
projects = ["MC", "MCPE", "BDS"]
source = "official" # official 或 mirror；当前环境 mirror 会触发 Cloudflare 验证
official_url = "https://bugs.mojang.com/api/jql-search-post"
mirror_url = "https://mojira.dev/api/v1"

[polling]
collect_minutes = 20
recheck_hours = 12
duplicate_recheck_hours = 168 # 软删除报告仍低频复查，以便重开后恢复
recheck_batch = 100
page_size = 50
bootstrap_pages = 2 # 首次只初始化最近的一部分报告（每项目最多 100 条）
initial_hours = 24
overlap_hours = 6
max_pages = 30 # 增量触顶不会推进检查点；请增大此值处理积压
backfill_hours = 168 # 每天回扫最近 7 天，缓解镜像延迟和分页变化
backfill_interval_hours = 24

[http]
timeout_seconds = 30
min_interval_seconds = 1
retries = 3

[classification]
mode = "crash" # crash（内置崩溃分类） / keywords（通用关键词） / all（全部）
fields = ["summary", "description", "environment"]
include_hangs = false
# 正则表达式，大小写不敏感；额外规则仅表示疑似崩溃
extra_patterns = []

[ai]
mode = "off" # off / candidates（规则命中） / all（所有新/变更报告）
# 可选：兼容 Chat Completions 格式的服务。密钥只从环境变量读取。
base_url = ""
model = ""
api_key_env = "MOJIRA_AI_API_KEY"
min_confidence = 0.75
max_chars = 16000

# 每个监控项继承上方公共配置；可独立覆盖 projects、source 及各配置节。
# 独立数据库和检查点，不会因另一个监控项的规则而移除记录。
[[monitors]]
id = "crashes"
name = "Minecraft 崩溃报告"
enabled = true
database = "data/mojira.sqlite3" # 继续使用第一版的数据库
tags = ["stability", "crash"]

[[monitors]]
id = "bedrock-performance"
name = "基岩版性能问题"
enabled = false # 改为 true 自动运行；也可 --monitor bedrock-performance 单独运行
projects = ["MCPE", "BDS"]
tags = ["performance", "bedrock"]
# 未指定 database 时自动生成 data/mojira.bedrock-performance.sqlite3

[monitors.classification]
mode = "keywords"
category = "performance"
keywords_any = ["fps", "stutter", "帧率", "卡顿"]
keywords_all = []
exclude_keywords = ["feature request"]
patterns_any = ['\blag(?:gy|ging)?\b'] # 单词边界，避免把 villager 当作 lag
exclude_patterns = []
case_sensitive = false

[monitors.polling]
collect_minutes = 30

[[monitors]]
id = "java-redstone"
name = "Java 红石问题"
enabled = false
projects = ["MC"]
tags = ["redstone"]

[monitors.classification]
mode = "keywords"
category = "redstone"
keywords_any = ["redstone", "piston", "红石", "活塞"]
fields = ["summary", "description"]

[monitors.filters]
# 以下是 issue 自身的 labels，大小写精确匹配。MC / MCPE 应写在 projects。
labels_any = [] # 任意命中，例如 ["实际存在的标签"]
labels_all = [] # 必须全部包含
exclude_labels = [] # 任意命中即排除
