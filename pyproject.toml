[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojira-crash-monitor"
version = "0.2.0"
description = "Configurable Mojira monitoring by project, keywords and labels, with duplicate tracking."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mojira-monitor = "mojira_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["mojira_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
